name: CI PROOF (credential fail-closed gates)

# Fork-only proof that the gates added by the PR branch actually RUN and PASS on
# a GitHub runner. Exists because the upstream job's earlier steps (`npm test`,
# the upstream functional e2e) are already red on main — see the PR description —
# so the new steps never got a chance to execute there.
#
# Runs on the fork when its PR is opened; the branch and this file are deleted
# immediately afterwards.

on:
  pull_request:

permissions:
  contents: read

jobs:
  credential-gates:
    name: Credential fail-closed gates (ubuntu runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: New unit test (blank credential + pre-auth probe)
        run: npx vitest run tests/unit/admin-credential-guard.test.js
      - name: Packaging guard — uci-defaults must not serve the board
        run: sh packaging/tests/test-92-admin-credential-guard.sh
      - name: Packaging guard — rpcd plugin + ACL fail closed
        run: sh packaging/tests/test-rpcd-tollgate-credential-guard.sh
      - run: npx playwright install --with-deps chromium
      - name: Admin SPA e2e — the board refuses an unset root credential
        run: npx playwright test --config admin/playwright.config.mjs admin-credential-guard
      - run: npm run build
